[package]
name = "buildcraft3d"
version = "0.1.0"
edition = "2021"
description = "3D BuildCraft: build, repair and prepare 3D models for printing"
license = "MIT OR Apache-2.0"
rust-version = "1.84"
default-run = "buildcraft3d"

[[bin]]
name = "buildcraft3d"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "accesskit"] }
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
gltf = "1.4"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
earcutr = "0.5"
epaint_default_fonts = "0.31"
ttf-parser = "0.25"
meshopt = "0.7"
manifold-rust = "0.19"
sys-locale = "0.3"
fontdb = "0.24"
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
nokhwa = { version = "0.10", features = ["input-native"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

# Same winit as eframe, to pick X11 on Linux: winit cannot take dropped files on Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }
